name: Scaffold New Service

on:
  workflow_dispatch:
    inputs:
      service_name:
        description: "Service name (e.g. lme-ms-pagos)"
        required: true
        type: string
      service_type:
        description: "Service type"
        required: true
        type: choice
        options: [frontend, backend, api-gateway, rpa, worker]
      team:
        description: "Team"
        required: true
        type: choice
        options: [equipo_desarrollo, equipo_rpa]
      stack:
        description: "Stack"
        required: true
        type: choice
        options: [nestjs, nextjs, python, nodejs]
      criticality:
        description: "Criticality"
        required: true
        type: choice
        options: [critical, high, medium, low]
      description:
        description: "Short description"
        required: true
        type: string
      discord_webhook_url:
        description: "Discord webhook URL for CI notifications"
        required: true
        type: string
      port_client_id:
        description: "Port client ID"
        required: true
        type: string
      port_client_secret:
        description: "Port client secret"
        required: true
        type: string

jobs:
  scaffold:
    name: Scaffold Service
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SERVICE_NAME: ${{ inputs.service_name }}
      SERVICE_TYPE: ${{ inputs.service_type }}
      TEAM: ${{ inputs.team }}
      STACK: ${{ inputs.stack }}
      CRITICALITY: ${{ inputs.criticality }}
      DESCRIPTION: ${{ inputs.description }}
      GH_TOKEN: ${{ secrets.SCAFFOLD_GH_TOKEN }}
      ORG: orbisdata-cl

    steps:
      - name: Validate service name
        run: |
          if ! echo "$SERVICE_NAME" | grep -qE '^[a-z][a-z0-9-]+$'; then
            echo "❌ Invalid service name. Use lowercase letters, numbers and hyphens only."
            exit 1
          fi
          echo "✅ Service name valid: $SERVICE_NAME"

      - name: Check repo does not exist
        run: |
          STATUS=$(gh api repos/$ORG/$SERVICE_NAME --silent 2>&1 && echo "exists" || echo "not_found")
          if [ "$STATUS" = "exists" ]; then
            echo "❌ Repository $ORG/$SERVICE_NAME already exists."
            exit 1
          fi
          echo "✅ Repository name available"

      - name: Create repository
        run: |
          gh api orgs/$ORG/repos \
            --method POST \
            --field name="$SERVICE_NAME" \
            --field description="$DESCRIPTION" \
            --field private=true \
            --field auto_init=true
          echo "✅ Repository created: $ORG/$SERVICE_NAME"
          sleep 5

      - name: Create develop branch
        run: |
          SHA=$(gh api repos/$ORG/$SERVICE_NAME/git/refs/heads/main --jq '.object.sha')
          gh api repos/$ORG/$SERVICE_NAME/git/refs \
            --method POST \
            --field ref="refs/heads/develop" \
            --field sha="$SHA"
          echo "✅ Branch develop created"

      - name: Set default branch to develop
        run: |
          gh api repos/$ORG/$SERVICE_NAME \
            --method PATCH \
            --field default_branch="develop"
          echo "✅ Default branch set to develop"

      - name: Set CODEOWNERS
        run: |
          if [ "$TEAM" = "equipo_rpa" ]; then
            OWNER="@orbisdata-cl/alfonso-chiguay-orbis"
          else
            OWNER="@orbisdata-cl/pmorenocla"
          fi
          CONTENT="* $OWNER"
          gh api repos/$ORG/$SERVICE_NAME/contents/.github/CODEOWNERS \
            --method PUT \
            --field message="ci: add CODEOWNERS" \
            --field content="$(echo "$CONTENT" | base64)" \
            --field branch="develop"
          echo "✅ CODEOWNERS created ($OWNER)"

      - name: Set PR template
        run: |
          cat > /tmp/pr_template.md << 'PREOF'
          ## 📋 Description

          <!-- Briefly describe what this PR does and why. -->

          Closes #

          ## 🔄 Type of Change

          - [ ] 🐛 Bug fix
          - [ ] ✨ New feature
          - [ ] 🔨 Refactor
          - [ ] 📝 Documentation
          - [ ] 🔧 Configuration / Infrastructure
          - [ ] ⚡ Performance improvement

          ## ✅ Checklist

          - [ ] Code follows the project conventions
          - [ ] Self-reviewed the code
          - [ ] Added / updated tests
          - [ ] No new warnings or errors introduced
          - [ ] Relevant documentation updated

          ## 🧪 How to Test

          1.
          2.
          3.

          ## 📸 Screenshots (if applicable)

          ## 💬 Additional Notes
          PREOF

          gh api repos/$ORG/$SERVICE_NAME/contents/.github/pull_request_template.md \
            --method PUT \
            --field message="ci: add PR template" \
            --field content="$(base64 < /tmp/pr_template.md)" \
            --field branch="develop"
          echo "✅ PR template created"

      - name: Set .gitignore
        run: |
          if [ "$STACK" = "python" ]; then
            GITIGNORE="__pycache__/\n*.pyc\n.venv/\nvenv/\n.env\n*.log\n.DS_Store\ndist/\nbuild/"
          elif [ "$STACK" = "nextjs" ]; then
            GITIGNORE="node_modules/\n.next/\nout/\ncoverage/\n.env*.local\n*.log\n.DS_Store\n*.tsbuildinfo"
          else
            GITIGNORE="node_modules/\ndist/\ncoverage/\n.env\n.env.local\n*.log\n.DS_Store"
          fi
          printf "$GITIGNORE" > /tmp/.gitignore
          gh api repos/$ORG/$SERVICE_NAME/contents/.gitignore \
            --method PUT \
            --field message="ci: add .gitignore" \
            --field content="$(base64 < /tmp/.gitignore)" \
            --field branch="develop"
          echo "✅ .gitignore created ($STACK)"

      - name: Set sonar-project.properties
        run: |
          if [ "$STACK" = "python" ]; then
            SOURCES="."
            EXCLUSIONS="**/__pycache__/**,**/tests/**,**/.venv/**"
            LCOV="coverage.xml"
          elif [ "$STACK" = "nextjs" ]; then
            SOURCES="./src"
            EXCLUSIONS="**/*.spec.ts,node_modules/**,coverage/**,.next/**,out/**"
            LCOV="./coverage/lcov.info"
          else
            SOURCES="./src"
            EXCLUSIONS="**/*.spec.ts,**/*.module.ts,**/*.config.ts,node_modules/**,coverage/**,dist/**"
            LCOV="./coverage/lcov.info"
          fi

          cat > /tmp/sonar.properties << SONAREOF
          sonar.projectKey=$SERVICE_NAME
          sonar.projectName=$SERVICE_NAME
          sonar.projectVersion=1.0.0
          sonar.sources=$SOURCES
          sonar.exclusions=$EXCLUSIONS
          sonar.javascript.lcov.reportPaths=$LCOV
          sonar.sourceEncoding=UTF-8
          SONAREOF

          gh api repos/$ORG/$SERVICE_NAME/contents/sonar-project.properties \
            --method PUT \
            --field message="ci: add SonarQube configuration" \
            --field content="$(base64 < /tmp/sonar.properties)" \
            --field branch="develop"
          echo "✅ sonar-project.properties created"

      - name: Set README
        run: |
          case "$STACK" in
            nestjs)  STACK_LABEL="NestJS" ;;
            nextjs)  STACK_LABEL="Next.js" ;;
            python)  STACK_LABEL="Python" ;;
            nodejs)  STACK_LABEL="Node.js" ;;
          esac

          cat > /tmp/README.md << READMEEOF
          # $SERVICE_NAME

          $DESCRIPTION

          ## Stack

          - **Framework**: $STACK_LABEL
          - **Type**: $SERVICE_TYPE
          - **Team**: $TEAM
          - **Criticality**: $CRITICALITY

          ## Getting Started

          \`\`\`bash
          npm install
          npm run dev
          npm run test:coverage
          \`\`\`

          ## CI/CD

          - **CI**: Runs on every PR to \`develop\` and \`main\`
          - **Sonar**: [View analysis](https://sonar.orbisdata.cl/dashboard?id=$SERVICE_NAME)
          READMEEOF

          README_SHA=$(gh api repos/$ORG/$SERVICE_NAME/contents/README.md --jq ".sha" 2>/dev/null || echo "")
          if [ -n "$README_SHA" ]; then
            gh api repos/$ORG/$SERVICE_NAME/contents/README.md \
              --method PUT \
              --field message="docs: initial README" \
              --field content="$(base64 < /tmp/README.md)" \
              --field sha="$README_SHA" \
              --field branch="develop"
          else
            gh api repos/$ORG/$SERVICE_NAME/contents/README.md \
              --method PUT \
              --field message="docs: initial README" \
              --field content="$(base64 < /tmp/README.md)" \
              --field branch="develop"
          fi
          echo "✅ README created"

      - name: Checkout templates
        uses: actions/checkout@v4
        with:
          path: templates-repo

      - name: Set CI workflow
        run: |
          # Copiar el template desde el repo — sin heredocs, sin expansión de variables
          gh api repos/$ORG/$SERVICE_NAME/contents/.github/workflows/ci.yml \
            --method PUT \
            --field message="ci: add CI workflow" \
            --field content="$(base64 < templates-repo/templates/ci.yml)" \
            --field branch="develop"
          echo "✅ CI workflow created"

      - name: Set release tracking workflow
        run: |
          cat > /tmp/release-port.yml << 'RELEASEEOF'
          name: Register Release in Port

          on:
            push:
              tags:
                - 'v*.*.*'

          jobs:
            register-release:
              name: Register Release
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                  with:
                    fetch-depth: 0
                - name: Extract metadata
                  id: meta
                  run: |
                    VERSION="${GITHUB_REF_NAME}"
                    REPO="${GITHUB_REPOSITORY##*/}"
                    TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
                    RELEASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${VERSION}"
                    DEPLOYMENT_ID="${REPO}-${VERSION//\./-}"
                    echo "VERSION=$VERSION"             >> $GITHUB_OUTPUT
                    echo "REPO=$REPO"                   >> $GITHUB_OUTPUT
                    echo "TIMESTAMP=$TIMESTAMP"         >> $GITHUB_OUTPUT
                    echo "RELEASE_URL=$RELEASE_URL"     >> $GITHUB_OUTPUT
                    echo "DEPLOYMENT_ID=$DEPLOYMENT_ID" >> $GITHUB_OUTPUT
                - name: Register deployment in Port
                  env:
                    PORT_CLIENT_ID: ${{ secrets.PORT_CLIENT_ID }}
                    PORT_CLIENT_SECRET: ${{ secrets.PORT_CLIENT_SECRET }}
                  run: |
                    TOKEN=$(curl -s -X POST "https://api.port.io/v1/auth/access_token"                       -H "Content-Type: application/json"                       -d "{"clientId": "$PORT_CLIENT_ID", "clientSecret": "$PORT_CLIENT_SECRET"}"                       | jq -r '.accessToken')
                    curl -s -X POST "https://api.port.io/v1/blueprints/deployment/entities?upsert=true"                       -H "Authorization: Bearer $TOKEN"                       -H "Content-Type: application/json"                       -d "{
                        \"identifier\": \"${{ steps.meta.outputs.DEPLOYMENT_ID }}\",
                        \"title\": \"${{ steps.meta.outputs.REPO }} ${{ steps.meta.outputs.VERSION }}\",
                        \"properties\": {
                          \"version\": \"${{ steps.meta.outputs.VERSION }}\",
                          \"deploymentStatus\": \"Success\",
                          \"environment\": \"production\",
                          \"createdAt\": \"${{ steps.meta.outputs.TIMESTAMP }}\",
                          \"deployed_by\": \"${{ github.actor }}\",
                          \"commit_sha\": \"${{ github.sha }}\",
                          \"release_url\": \"${{ steps.meta.outputs.RELEASE_URL }}\"
                        },
                        \"relations\": {\"service\": \"${{ steps.meta.outputs.REPO }}\"}
                      }" | jq .ok
          RELEASEEOF

          gh api repos/$ORG/$SERVICE_NAME/contents/.github/workflows/release-port.yml             --method PUT             --field message="ci: add release tracking workflow for Port"             --field content="$(base64 < /tmp/release-port.yml)"             --field branch="develop"
          echo "✅ Release tracking workflow created"

      - name: Add DISCORD_WEBHOOK_URL secret
        run: |
          gh secret set DISCORD_WEBHOOK_URL \
            --body "${{ inputs.discord_webhook_url }}" \
            --repo $ORG/$SERVICE_NAME
          echo "✅ Discord webhook secret added"

      - name: Register service in Port
        run: |
          TOKEN=$(curl -s -X POST "https://api.port.io/v1/auth/access_token" \
            -H "Content-Type: application/json" \
            -d "{\"clientId\": \"${{ inputs.port_client_id }}\", \"clientSecret\": \"${{ inputs.port_client_secret }}\"}" \
            | jq -r '.accessToken')

          curl -s -X POST "https://api.port.io/v1/blueprints/service/entities?upsert=true" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d "{
              \"identifier\": \"$SERVICE_NAME\",
              \"title\": \"$SERVICE_NAME\",
              \"team\": [\"$TEAM\"],
              \"properties\": {
                \"criticality\": \"$CRITICALITY\",
                \"service_type\": \"$SERVICE_TYPE\",
                \"github_url\": \"https://github.com/$ORG/$SERVICE_NAME\",
                \"github_visibility\": \"private\",
                \"github_default_branch\": \"develop\",
                \"github_description\": \"$DESCRIPTION\"
              }
            }"
          echo "✅ Service registered in Port"

      - name: Summary
        run: |
          echo "## ✅ Service scaffolded successfully" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Name** | \`$SERVICE_NAME\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Type** | $SERVICE_TYPE |" >> $GITHUB_STEP_SUMMARY
          echo "| **Team** | $TEAM |" >> $GITHUB_STEP_SUMMARY
          echo "| **Stack** | $STACK |" >> $GITHUB_STEP_SUMMARY
          echo "| **Criticality** | $CRITICALITY |" >> $GITHUB_STEP_SUMMARY
          echo "| **Repo** | [orbisdata-cl/$SERVICE_NAME](https://github.com/orbisdata-cl/$SERVICE_NAME) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Port** | [View in Port](https://app.port.io) |" >> $GITHUB_STEP_SUMMARY
